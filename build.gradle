// --- Flyway(MySQL) を plugin 実行クラスパスへ ---
buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath "org.flywaydb:flyway-mysql:11.14.1"
    }
}

plugins {
    id "java"
    id "groovy"
    id "org.flywaydb.flyway" version "11.14.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.AMAZON
    }
}

repositories { mavenCentral() }

// --- JDBC ドライバ（プロジェクト実行クラスパス） ---
// --- テスト（Groovy + Spock + Testcontainers[MySQL]）。information_schema 表明テストで
//     Flyway マイグレーション（flyway/sql・flyway/sql-test）を Docker 上の MySQL 8.4 に適用し検証する。 ---
dependencies {
    runtimeOnly "com.mysql:mysql-connector-j:8.0.33"

    testImplementation "org.apache.groovy:groovy:4.0.32"
    testImplementation "org.apache.groovy:groovy-sql:4.0.32"
    testImplementation "org.spockframework:spock-core:2.3-groovy-4.0"
    testImplementation "org.testcontainers:mysql:1.21.3"
    testImplementation "org.flywaydb:flyway-core:11.14.1"
    testImplementation "org.flywaydb:flyway-mysql:11.14.1"
    testImplementation "com.mysql:mysql-connector-j:8.0.33"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.3"
}

test {
    useJUnitPlatform()
}

// --- Flyway 設定（ここが要） ---
flyway {
    url = "jdbc:mysql://localhost:3306/jpetstore_db?useSSL=false&allowPublicKeyRetrieval=true"
    user = "jpetstore"
    password = "jpetstore"
    driver = "com.mysql.cj.jdbc.Driver"
    locations = ["filesystem:flyway/sql"]
    cleanDisabled = false
}

// --- m_code → frontend(TypeScript) enum 生成 ---
tasks.register("generateEnums", JavaExec) {
    group = "codegen"
    description = "Generate enum constants for frontend (TypeScript) from m_code"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.example.jpetstore.database.tool.MultiEnumGenerator"
}

// --- 開発・テスト用データ（flyway/sql-test）を追加適用 ---
// locations は flyway/sql を含めて渡すこと。sql-test だけを渡すと、
// flywayMigrate で適用済みの flyway/sql 側マイグレーションが「現在の locations から解決できない」
// として Flyway の validate が失敗する（Detected applied migration not resolved locally）。
tasks.register("seedDevData", org.flywaydb.gradle.task.FlywayMigrateTask) {
    group = "flyway"
    description = "Apply dev/test-only data migrations (flyway/sql-test)."
    dependsOn("flywayMigrate")

    locations = ["filesystem:flyway/sql", "filesystem:flyway/sql-test"]
}
